<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Chrome update</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --page-bg: #111318;
      --text: #f4f6fb;
      --panel-bg: rgba(29, 32, 40, .92);
      --panel-border: rgba(255, 255, 255, .12);
      --muted: #abb3c5;
      --brand: #b7c1d9;
      --version-text: #d7e4ff;
      --version-bg: rgba(66, 133, 244, .14);
      --button-text: #f7f9ff;
      --secondary-bg: rgba(255, 255, 255, .09);
      --secondary-hover: rgba(255, 255, 255, .15);
      --status: #9fb5df;
      --error: #ff9e9e;
      --blue-glow: rgba(66, 133, 244, .22);
      --green-glow: rgba(52, 168, 83, .17);
      background: var(--page-bg);
      color: var(--text);
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --page-bg: #f1f4f8;
        --text: #152033;
        --panel-bg: rgba(255, 255, 255, .94);
        --panel-border: rgba(24, 39, 58, .14);
        --muted: #596578;
        --brand: #53627a;
        --version-text: #2b5fa8;
        --version-bg: rgba(66, 133, 244, .11);
        --button-text: #ffffff;
        --secondary-bg: rgba(24, 39, 58, .08);
        --secondary-hover: rgba(24, 39, 58, .14);
        --status: #5270a0;
        --error: #bd3d4c;
        --blue-glow: rgba(66, 133, 244, .16);
        --green-glow: rgba(52, 168, 83, .12);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: block;
      background:
        radial-gradient(circle at 15% 10%, var(--blue-glow), transparent 34%),
        radial-gradient(circle at 90% 90%, var(--green-glow), transparent 30%),
        var(--page-bg);
      overflow: auto;
    }

    .panel {
      width: 100%;
      min-height: 100vh;
      padding: 30px;
      border: 0;
      border-radius: 0;
      background: var(--panel-bg);
      box-shadow: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--brand);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .brand-icon {
      width: 18px;
      height: 18px;
      display: inline-block;
      object-fit: contain;
    }

    h1 {
      margin: 26px 0 10px;
      font-size: 29px;
      line-height: 1.05;
      letter-spacing: -.035em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .version {
      display: inline-flex;
      margin-top: 18px;
      padding: 7px 10px;
      border-radius: 9px;
      color: var(--version-text);
      background: var(--version-bg);
      font: 600 12px ui-monospace, SFMono-Regular, monospace;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 28px;
    }

    button {
      flex: 1;
      min-height: 42px;
      border: 0;
      border-radius: 11px;
      color: var(--button-text);
      cursor: pointer;
      font: 700 14px ui-sans-serif, system-ui, sans-serif;
      transition: transform .15s ease, background .15s ease, opacity .15s ease;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: wait; opacity: .56; transform: none; }

    .primary { background: #3f7ff0; }
    .primary:hover { background: #5590f5; }
    .secondary { background: var(--secondary-bg); }
    .secondary:hover { background: var(--secondary-hover); }

    #status {
      min-height: 22px;
      margin-top: 17px;
      color: var(--status);
      font-size: 13px;
    }

    #status.error { color: var(--error); }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand"><img class="brand-icon" src="/icon.png" alt=""> Google Chrome</div>
    <h1 id="title">Update available</h1>
    <p id="message">A new Chrome package is available for your local installation.</p>
    <div class="version" id="version"></div>
    <div class="actions">
      <button class="primary" id="primary">Update now</button>
      <button class="secondary" id="secondary">Later</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const translations = {
      en: {
        pageTitle: 'Google Chrome update',
        updateAvailable: 'Update available',
        newPackage: 'A new Chrome package is available for your local installation.',
        version: 'Version',
        updateNow: 'Update now',
        later: 'Later',
        operationFailed: 'The operation failed.',
        closeWindow: 'You can close this window.',
        restarting: 'Restarting Chrome...',
        downloading: 'Downloading and installing...',
        updateInstalled: 'Update installed',
        testCompleted: 'Test mode completed. No files were changed.',
        readyAfterRestart: 'Chrome is ready to use the new version after a restart.',
        restartChrome: 'Restart Chrome',
        safeSimulation: 'This was a safe simulation.',
        sessionOpen: 'The current Chrome session is still open.'
      },
      es: {
        pageTitle: 'Actualización de Google Chrome',
        updateAvailable: 'Actualización disponible',
        newPackage: 'Hay un nuevo paquete de Chrome disponible para tu instalación local.',
        version: 'Versión',
        updateNow: 'Actualizar ahora',
        later: 'Más tarde',
        operationFailed: 'La operación falló.',
        closeWindow: 'Puedes cerrar esta ventana.',
        restarting: 'Reiniciando Chrome...',
        downloading: 'Descargando e instalando...',
        updateInstalled: 'Actualización instalada',
        testCompleted: 'Modo de prueba completado. No se modificaron archivos.',
        readyAfterRestart: 'Chrome está listo para usar la nueva versión después de reiniciarlo.',
        restartChrome: 'Reiniciar Chrome',
        safeSimulation: 'Esta fue una simulación segura.',
        sessionOpen: 'La sesión actual de Chrome sigue abierta.'
      },
      fr: {
        pageTitle: 'Mise à jour de Google Chrome',
        updateAvailable: 'Mise à jour disponible',
        newPackage: 'Un nouveau paquet Chrome est disponible pour votre installation locale.',
        version: 'Version',
        updateNow: 'Mettre à jour',
        later: 'Plus tard',
        operationFailed: "L'opération a échoué.",
        closeWindow: 'Vous pouvez fermer cette fenêtre.',
        restarting: 'Redémarrage de Chrome...',
        downloading: 'Téléchargement et installation...',
        updateInstalled: 'Mise à jour installée',
        testCompleted: "Mode test terminé. Aucun fichier n'a été modifié.",
        readyAfterRestart: 'Chrome est prêt à utiliser la nouvelle version après un redémarrage.',
        restartChrome: 'Redémarrer Chrome',
        safeSimulation: 'Ceci était une simulation sans risque.',
        sessionOpen: 'La session Chrome actuelle est toujours ouverte.'
      },
      zh: {
        pageTitle: 'Google Chrome 更新',
        updateAvailable: '有可用更新',
        newPackage: '本地安装有新的 Chrome 软件包可用。',
        version: '版本',
        updateNow: '立即更新',
        later: '稍后',
        operationFailed: '操作失败。',
        closeWindow: '您可以关闭此窗口。',
        restarting: '正在重启 Chrome...',
        downloading: '正在下载并安装...',
        updateInstalled: '更新已安装',
        testCompleted: '测试模式已完成。未更改任何文件。',
        readyAfterRestart: '重启后，Chrome 即可使用新版本。',
        restartChrome: '重启 Chrome',
        safeSimulation: '这是一次安全模拟。',
        sessionOpen: '当前 Chrome 会话仍处于打开状态。'
      },
      ru: {
        pageTitle: 'Обновление Google Chrome',
        updateAvailable: 'Доступно обновление',
        newPackage: 'Доступен новый пакет Chrome для локальной установки.',
        version: 'Версия',
        updateNow: 'Обновить сейчас',
        later: 'Позже',
        operationFailed: 'Операция не выполнена.',
        closeWindow: 'Это окно можно закрыть.',
        restarting: 'Перезапуск Chrome...',
        downloading: 'Загрузка и установка...',
        updateInstalled: 'Обновление установлено',
        testCompleted: 'Тестовый режим завершён. Файлы не изменялись.',
        readyAfterRestart: 'После перезапуска Chrome будет готов использовать новую версию.',
        restartChrome: 'Перезапустить Chrome',
        safeSimulation: 'Это была безопасная симуляция.',
        sessionOpen: 'Текущий сеанс Chrome всё ещё открыт.'
      }
    };

    const browserLanguage = (navigator.language || 'en').toLowerCase();
    const locale = ['es', 'fr', 'zh', 'ru'].find(
      (candidate) => browserLanguage.startsWith(candidate)
    ) || 'en';
    const copy = translations[locale];
    const token = __UPDATE_TOKEN__;
    const version = __UPDATE_VERSION__;
    const title = document.querySelector('#title');
    const message = document.querySelector('#message');
    const versionLabel = document.querySelector('#version');
    const primary = document.querySelector('#primary');
    const secondary = document.querySelector('#secondary');
    const status = document.querySelector('#status');
    let action = 'update';

    document.documentElement.lang = locale;
    document.title = copy.pageTitle;
    title.textContent = copy.updateAvailable;
    message.textContent = copy.newPackage;
    versionLabel.textContent = `${copy.version} ${version}`;
    primary.textContent = copy.updateNow;
    secondary.textContent = copy.later;

    async function request(path) {
      const response = await fetch(`${path}?token=${encodeURIComponent(token)}`, { method: 'POST' });
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || copy.operationFailed);
      return data;
    }

    function setStatus(text, error = false) {
      status.textContent = text;
      status.classList.toggle('error', error);
    }

    function closeWindow() {
      window.close();
      setStatus(copy.closeWindow);
    }

    secondary.addEventListener('click', async () => {
      secondary.disabled = true;
      primary.disabled = true;
      try { await request('/api/later'); } catch (_) {}
      closeWindow();
    });

    primary.addEventListener('click', async () => {
      if (action === 'restart') {
        primary.disabled = true;
        secondary.disabled = true;
        setStatus(copy.restarting);
        try { await request('/api/restart'); } catch (_) {}
        closeWindow();
        return;
      }

      primary.disabled = true;
      secondary.disabled = true;
      setStatus(copy.downloading);
      try {
        const result = await request('/api/update');
        title.textContent = copy.updateInstalled;
        message.textContent = result.test
          ? copy.testCompleted
          : copy.readyAfterRestart;
        action = 'restart';
        primary.textContent = copy.restartChrome;
        primary.disabled = false;
        secondary.disabled = false;
        setStatus(result.test
          ? copy.safeSimulation
          : copy.sessionOpen);
      } catch (error) {
        primary.disabled = false;
        secondary.disabled = false;
        setStatus(error.message, true);
      }
    });
  </script>
</body>
</html>
